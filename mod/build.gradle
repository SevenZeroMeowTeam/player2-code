plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.jetbrains.kotlin.jvm' version '1.9.20'
    id 'eclipse'
    id 'maven-publish'
}

version = '1.0.0'
group = 'cn.qlm.player2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory = project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                create('player2') {
                    source sourceSets.main
                }
            }
        }
        client {
        }
        server {
        }
    }
}

dependencies {
    minecraft('net.minecraftforge:forge:1.20.1-47.4.22')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'com.neovisionaries:nv-websocket-client:2.14'
    implementation 'com.google.code.gson:gson:2.10.1'
}

// Replace @version@ token in mods.toml at UTF-8 byte level AFTER processResources
// (processResources uses JVM default charset which is GBK on Windows, corrupting CJK)
tasks.register('patchModsToml') {
    inputs.property('version', project.version)
    doLast {
        def resourcesOutput = sourceSets.main.output.resourcesDir
        def targetFile = file("$resourcesOutput/META-INF/mods.toml")
        if (targetFile.exists()) {
            def utf8 = java.nio.charset.StandardCharsets.UTF_8
            def bytes = java.nio.file.Files.readAllBytes(targetFile.toPath())
            // Even if processResources already corrupted, read source of truth from src dir
            def srcFile = file("$projectDir/src/main/resources/META-INF/mods.toml")
            if (srcFile.exists()) {
                bytes = java.nio.file.Files.readAllBytes(srcFile.toPath())
            }
            def text = new String(bytes, utf8)
            def replaced = text.replace('@version@', project.version as String)
            java.nio.file.Files.write(targetFile.toPath(), replaced.getBytes(utf8))
        }
    }
}
tasks.processResources.configure { finalizedBy('patchModsToml') }
tasks.classes.configure { dependsOn('patchModsToml') }

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs = ['-Xjvm-default=all']
    }
}
